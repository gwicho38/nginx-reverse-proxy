events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Basic settings
    sendfile on;
    keepalive_timeout 65;
    
    # DNS resolver
    resolver 127.0.0.11 valid=30s;
    
    # Main website upstream
    upstream main_backend {
        server test-backend:80;
    }
    
    # HTTP Server - Main domain
    server {
        listen 80;
        server_name localhost;
        
        location / {
            proxy_pass http://main_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
    
    # HTTP Server - Reposlite subdomain
    server {
        listen 80;
        server_name reposlite.lefv.ddns.net;
        
        location / {
            # Route to Reposlite on host
            set $reposlite_backend 172.17.0.1:9156;
            proxy_pass http://$reposlite_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            return 200 "Reposlite OK";
            add_header Content-Type text/plain;
        }
    }
    
    # HTTPS Server - Main domain
    server {
        listen 443 ssl http2;
        server_name localhost;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        location / {
            proxy_pass http://main_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            return 200 "OK HTTPS";
            add_header Content-Type text/plain;
        }
    }
    
    # HTTPS Server - Reposlite subdomain
    server {
        listen 443 ssl http2;
        server_name reposlite.lefv.ddns.net;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        location / {
            # Route to Reposlite on host
            set $reposlite_backend 172.17.0.1:9156;
            proxy_pass http://$reposlite_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
            return 200 "Reposlite HTTPS OK";
            add_header Content-Type text/plain;
        }
    }
}
