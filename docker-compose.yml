version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"   # HTTP
      - "8443:443"  # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    networks:
      - proxy-network
    depends_on:
      - test-backend

  # Test backend service
  test-backend:
    image: nginx:alpine
    container_name: test-backend
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
